name: Refresh profile contributions

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-contributions.yml'
      - '.github/profile-studio/**'

permissions:
  contents: write

concurrency:
  group: contribution-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'amasen02/amasen02' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test contribution presentation
        env:
          PYTHONPATH: .github/profile-studio
        run: python -m unittest discover -s .github/profile-studio/tests -v
      - name: Refresh verified external merges
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: .github/profile-studio
        run: |
          python -m agent.refresh_contributions --username amasen02 --readme README.md --receipt "$RUNNER_TEMP/profile-contributions-receipt.json"
          python - <<'PY'
          import json, os
          receipt = json.load(open(os.environ["RUNNER_TEMP"] + "/profile-contributions-receipt.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={str(receipt['changed']).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Contribution refresh\n\n")
              summary.write(f"Changed README: `{receipt['changed']}`\n\n")
              summary.write(f"Verified external merges: `{receipt['newcount']}`\n")
          PY
      - name: Verify only README changed
        run: |
          git diff --cached --quiet
          changed="$(git diff --name-only)"
          test -z "$changed" || test "$changed" = "README.md"
      - name: Commit refreshed README when needed
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git diff --cached --quiet
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          test "$(git diff --cached --name-only)" = "README.md"
          git commit -m 'chore: refresh verified contributions'
          git push origin HEAD:main
      - name: Upload refresh receipt
        if: failure() || steps.refresh.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: profile-contributions-receipt
          path: ${{ runner.temp }}/profile-contributions-receipt.json
          if-no-files-found: warn
          retention-days: 7
