<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <title>FreshCart: 12 independently-architected microservices and their CI/CD pipeline</title>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
  </defs>

  <rect width="900" height="320" rx="14" fill="url(#bg3)"/>
  <rect x="1" y="1" width="898" height="318" rx="13" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <text x="25" y="26" font-family="monospace" font-size="12.5" fill="#39ff88" font-weight="bold">FRESHCART — 12 services, 12 deliberate architectures (no copy-paste structure)</text>

  <!-- service grid: name + chosen pattern -->
  <g font-family="monospace">
    <!-- row 1 -->
    <g transform="translate(25,36)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#233047"/>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Identity</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Clean Architecture + ASP.NET Identity</text>
    </g>
    <g transform="translate(240,36)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#233047"/>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Catalog</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Vertical Slice + Carter/MediatR + Marten</text>
    </g>
    <g transform="translate(455,36)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#233047"/>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Pricing</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Simple services + gRPC hot path</text>
    </g>
    <g transform="translate(670,36)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#233047"/>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Basket</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Vertical Slice + Redis HybridCache + Outbox</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(25,96)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#233047"/>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Ordering</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Clean Arch + DDD + MassTransit Saga</text>
    </g>
    <g transform="translate(240,96)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#233047"/>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Inventory</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Layered: Repository + Unit of Work + Dapper</text>
    </g>
    <g transform="translate(455,96)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#233047"/>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Payment</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Clean Arch + Event Sourcing (MongoDB)</text>
    </g>
    <g transform="translate(670,96)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#233047"/>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Delivery</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Hexagonal (Ports &amp; Adapters) + MongoDB</text>
    </g>
    <!-- row 3 -->
    <g transform="translate(25,156)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#233047"/>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Notification</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Consumers + SignalR fan-out hub</text>
    </g>
    <g transform="translate(240,156)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#233047"/>
      <text x="10" y="20" font-size="11" fill="#e6edf3">CustomerSupport</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Connection manager + SignalR + Repository</text>
    </g>
    <g transform="translate(455,156)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#233047"/>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Reviews</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Vertical Slice + MongoDB, eventual consistency</text>
    </g>
    <g transform="translate(670,156)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#233047"/>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Reporting</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">CQRS read model + Dapper + MySQL</text>
    </g>
  </g>

  <text x="25" y="232" font-family="monospace" font-size="12.5" fill="#39ff88" font-weight="bold">CI/CD — per service, every merge</text>

  <!-- pipeline: active stages (solid) -->
  <g font-family="monospace" font-size="9.5">
    <g transform="translate(25,244)">
      <rect width="95" height="34" rx="5" fill="#0f2417" stroke="#39ff88"/>
      <text x="10" y="21" fill="#39ff88">Restore</text>
    </g>
    <g transform="translate(130,244)">
      <rect width="95" height="34" rx="5" fill="#0f2417" stroke="#39ff88"/>
      <text x="10" y="21" fill="#39ff88">Build</text>
    </g>
    <g transform="translate(235,244)">
      <rect width="95" height="34" rx="5" fill="#0f2417" stroke="#39ff88"/>
      <text x="10" y="21" fill="#39ff88">Test</text>
    </g>
    <g transform="translate(340,244)">
      <rect width="95" height="34" rx="5" fill="#0f2417" stroke="#39ff88"/>
      <text x="6" y="21" fill="#39ff88">CodeQL SAST</text>
    </g>
    <g transform="translate(445,244)">
      <rect width="95" height="34" rx="5" fill="#0f2417" stroke="#39ff88"/>
      <text x="4" y="21" fill="#39ff88">E2E Playwright</text>
    </g>

    <!-- planned stages (dashed, amber) -->
    <g transform="translate(550,244)" opacity="0.85">
      <rect width="95" height="34" rx="5" fill="none" stroke="#ffb454" stroke-dasharray="4 3"/>
      <text x="2" y="15" fill="#ffb454">SonarCloud</text>
      <text x="14" y="27" fill="#ffb454" font-size="8">(planned)</text>
    </g>
    <g transform="translate(655,244)" opacity="0.85">
      <rect width="95" height="34" rx="5" fill="none" stroke="#ffb454" stroke-dasharray="4 3"/>
      <text x="18" y="15" fill="#ffb454">Trivy</text>
      <text x="14" y="27" fill="#ffb454" font-size="8">(planned)</text>
    </g>
    <g transform="translate(760,244)" opacity="0.85">
      <rect width="115" height="34" rx="5" fill="none" stroke="#ffb454" stroke-dasharray="4 3"/>
      <text x="12" y="15" fill="#ffb454">Cosign sign</text>
      <text x="24" y="27" fill="#ffb454" font-size="8">(planned)</text>
    </g>

    <!-- arrows -->
    <g stroke="#39ff88" stroke-width="1.2" fill="none">
      <path d="M120 261 L129 261" marker-end="url(#arrow)"/>
      <path d="M225 261 L234 261" marker-end="url(#arrow)"/>
      <path d="M330 261 L339 261" marker-end="url(#arrow)"/>
      <path d="M435 261 L444 261" marker-end="url(#arrow)"/>
    </g>
    <g stroke="#ffb454" stroke-width="1" fill="none" stroke-dasharray="3 2">
      <path d="M540 261 L549 261"/>
      <path d="M645 261 L654 261"/>
      <path d="M750 261 L759 261"/>
    </g>
  </g>

  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#39ff88"/>
    </marker>
  </defs>

  <text x="25" y="300" font-family="monospace" font-size="9.5" fill="#8ab" opacity="0.85">merge is blocked until build + test + SAST + E2E are green on every touched service — Sonar/Trivy/Cosign are the next gates going live</text>
</svg>
