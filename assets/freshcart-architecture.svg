<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <title>FreshCart: 12 independently-architected microservices and their live CI/CD pipeline</title>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#39ff88"/>
    </marker>
    <radialGradient id="sigilFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="archScanBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff88" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="archClip">
      <rect width="900" height="400" rx="14"/>
    </clipPath>
    <filter id="archGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="400" rx="14" fill="url(#bg3)"/>

  <!-- sweeping light beam across the whole panel -->
  <rect x="0" y="0" width="160" height="400" fill="url(#archScanBeam)" clip-path="url(#archClip)">
    <animate attributeName="x" values="-160;900;-160" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- faint mystic sigil, barely visible, behind everything -->
  <g transform="translate(450,205)" opacity="0.9">
    <circle r="220" fill="url(#sigilFade)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="46s" repeatCount="indefinite"/>
      <g stroke="#a855f7" stroke-width="0.5" fill="none" opacity="0.18">
        <circle r="190"/>
        <circle r="150" stroke-dasharray="2 6"/>
        <circle r="110"/>
        <line x1="-220" y1="0" x2="220" y2="0"/>
        <line x1="0" y1="-220" x2="0" y2="220"/>
      </g>
    </g>
    <circle r="3" fill="#a855f7" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- hidden message, decodable, styled as ambient boot noise: binary for "WAKE UP" -->
  <text x="700" y="14" font-family="monospace" font-size="6.5" fill="#39ff88" opacity="0.28" letter-spacing="1">01010111 01000001 01001011 01000101 00100000 01010101 01010000</text>

  <rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <text x="30" y="30" font-family="monospace" font-size="13" fill="#39ff88" font-weight="bold" filter="url(#archGlow)">FRESHCART — 12 services, 12 deliberate architectures</text>

  <g transform="translate(370,42)" font-family="monospace" font-size="10.5">
    <rect width="160" height="24" rx="12" fill="#0f2417" stroke="#39ff88" stroke-width="1"/>
    <text x="80" y="16" text-anchor="middle" fill="#39ff88">API GATEWAY (YARP)</text>
  </g>

  <!-- service grid: one accent color, generous spacing, minimal decoration -->
  <g font-family="monospace">
    <g transform="translate(30,86)">
      <rect width="200" height="56" rx="7" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="5s" begin="0.0s" repeatCount="indefinite"/></rect>
      <text x="14" y="24" font-size="12.5" fill="#e6edf3" font-weight="bold">Identity</text>
      <text x="14" y="41" font-size="9.5" fill="#39ff88">Clean Architecture · ASP.NET Identity</text>
    </g>
    <g transform="translate(250,86)">
      <rect width="200" height="56" rx="7" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="5s" begin="0.4s" repeatCount="indefinite"/></rect>
      <text x="14" y="24" font-size="12.5" fill="#e6edf3" font-weight="bold">Catalog</text>
      <text x="14" y="41" font-size="9.5" fill="#39ff88">Vertical Slice · Marten</text>
    </g>
    <g transform="translate(470,86)">
      <rect width="200" height="56" rx="7" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="5s" begin="0.8s" repeatCount="indefinite"/></rect>
      <text x="14" y="24" font-size="12.5" fill="#e6edf3" font-weight="bold">Pricing</text>
      <text x="14" y="41" font-size="9.5" fill="#39ff88">gRPC hot path</text>
    </g>
    <g transform="translate(690,86)">
      <rect width="200" height="56" rx="7" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="5s" begin="1.2s" repeatCount="indefinite"/></rect>
      <text x="14" y="24" font-size="12.5" fill="#e6edf3" font-weight="bold">Basket</text>
      <text x="14" y="41" font-size="9.5" fill="#39ff88">Redis HybridCache · Outbox</text>
    </g>

    <g transform="translate(30,154)">
      <rect width="200" height="56" rx="7" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="5s" begin="1.6s" repeatCount="indefinite"/></rect>
      <text x="14" y="24" font-size="12.5" fill="#e6edf3" font-weight="bold">Ordering</text>
      <text x="14" y="41" font-size="9.5" fill="#39ff88">DDD · MassTransit Saga</text>
    </g>
    <g transform="translate(250,154)">
      <rect width="200" height="56" rx="7" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="5s" begin="2.0s" repeatCount="indefinite"/></rect>
      <text x="14" y="24" font-size="12.5" fill="#e6edf3" font-weight="bold">Inventory</text>
      <text x="14" y="41" font-size="9.5" fill="#39ff88">Repository + Unit of Work</text>
    </g>
    <g transform="translate(470,154)">
      <rect width="200" height="56" rx="7" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="5s" begin="2.4s" repeatCount="indefinite"/></rect>
      <text x="14" y="24" font-size="12.5" fill="#e6edf3" font-weight="bold">Payment</text>
      <text x="14" y="41" font-size="9.5" fill="#39ff88">Event Sourcing (MongoDB)</text>
    </g>
    <g transform="translate(690,154)">
      <rect width="200" height="56" rx="7" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="5s" begin="2.8s" repeatCount="indefinite"/></rect>
      <text x="14" y="24" font-size="12.5" fill="#e6edf3" font-weight="bold">Delivery</text>
      <text x="14" y="41" font-size="9.5" fill="#39ff88">Hexagonal · MongoDB</text>
    </g>

    <g transform="translate(30,222)">
      <rect width="200" height="56" rx="7" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="5s" begin="3.2s" repeatCount="indefinite"/></rect>
      <text x="14" y="24" font-size="12.5" fill="#e6edf3" font-weight="bold">Notification</text>
      <text x="14" y="41" font-size="9.5" fill="#39ff88">SignalR fan-out</text>
    </g>
    <g transform="translate(250,222)">
      <rect width="200" height="56" rx="7" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="5s" begin="3.6s" repeatCount="indefinite"/></rect>
      <text x="14" y="24" font-size="12.5" fill="#e6edf3" font-weight="bold">CustomerSupport</text>
      <text x="14" y="41" font-size="9.5" fill="#39ff88">SignalR · Repository</text>
    </g>
    <g transform="translate(470,222)">
      <rect width="200" height="56" rx="7" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="5s" begin="4.0s" repeatCount="indefinite"/></rect>
      <text x="14" y="24" font-size="12.5" fill="#e6edf3" font-weight="bold">Reviews</text>
      <text x="14" y="41" font-size="9.5" fill="#39ff88">Vertical Slice · MongoDB</text>
    </g>
    <g transform="translate(690,222)">
      <rect width="200" height="56" rx="7" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="5s" begin="4.4s" repeatCount="indefinite"/></rect>
      <text x="14" y="24" font-size="12.5" fill="#e6edf3" font-weight="bold">Reporting</text>
      <text x="14" y="41" font-size="9.5" fill="#39ff88">CQRS · Dapper · MySQL</text>
    </g>
  </g>

  <line x1="30" y1="300" x2="870" y2="300" stroke="#1f2937" stroke-width="1"/>

  <text x="30" y="322" font-family="monospace" font-size="12.5" fill="#39ff88" font-weight="bold" filter="url(#archGlow)">CI/CD — every merge</text>

  <g font-family="monospace" font-size="9.5">
    <g transform="translate(30,334)">
      <rect width="98" height="34" rx="5" fill="#0f2417" stroke="#39ff88"/>
      <text x="12" y="21" fill="#39ff88">Restore</text>
    </g>
    <g transform="translate(136,334)">
      <rect width="98" height="34" rx="5" fill="#0f2417" stroke="#39ff88"/>
      <text x="20" y="21" fill="#39ff88">Build</text>
    </g>
    <g transform="translate(242,334)">
      <rect width="98" height="34" rx="5" fill="#0f2417" stroke="#39ff88"/>
      <text x="24" y="21" fill="#39ff88">Test</text>
    </g>
    <g transform="translate(348,334)">
      <rect width="98" height="34" rx="5" fill="#0f2417" stroke="#39ff88"/>
      <text x="10" y="21" fill="#39ff88">CodeQL</text>
    </g>
    <g transform="translate(454,334)">
      <rect width="98" height="34" rx="5" fill="#0f2417" stroke="#39ff88"/>
      <text x="4" y="21" fill="#39ff88">E2E Tests</text>
    </g>
    <g transform="translate(560,334)">
      <rect width="98" height="34" rx="5" fill="#0f2417" stroke="#39ff88"/>
      <text x="18" y="21" fill="#39ff88">Trivy</text>
    </g>
    <g transform="translate(666,334)">
      <rect width="98" height="34" rx="5" fill="#0f2417" stroke="#39ff88"/>
      <text x="8" y="21" fill="#39ff88">Cosign</text>
    </g>
    <g transform="translate(772,334)" opacity="0.85">
      <rect width="98" height="34" rx="5" fill="none" stroke="#ffb454" stroke-dasharray="4 3"/>
      <text x="4" y="15" fill="#ffb454">SonarCloud</text>
      <text x="16" y="27" fill="#ffb454" font-size="7.5">(pending)</text>
    </g>

    <g stroke="#39ff88" stroke-width="1" fill="none" opacity="0.7">
      <path d="M128 351 L135 351" marker-end="url(#arrow)"/>
      <path d="M234 351 L241 351" marker-end="url(#arrow)"/>
      <path d="M340 351 L347 351" marker-end="url(#arrow)"/>
      <path d="M446 351 L453 351" marker-end="url(#arrow)"/>
      <path d="M552 351 L559 351" marker-end="url(#arrow)"/>
      <path d="M658 351 L665 351" marker-end="url(#arrow)"/>
      <path d="M764 351 L771 351" marker-end="url(#arrow)"/>
    </g>
  </g>

  <text x="30" y="388" font-family="monospace" font-size="9.5" fill="#8ab" opacity="0.85">merge blocked until every check is green — Cosign signs each image on master, keyless (Sigstore OIDC)</text>
</svg>
