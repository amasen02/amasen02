<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <title>FreshCart: 12 independently-architected microservices and their live CI/CD pipeline</title>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#39ff88"/>
    </marker>
  </defs>

  <rect width="900" height="320" rx="14" fill="url(#bg3)"/>
  <rect x="1" y="1" width="898" height="318" rx="13" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <text x="25" y="26" font-family="monospace" font-size="12.5" fill="#39ff88" font-weight="bold">FRESHCART — 12 services, 12 deliberate architectures (no copy-paste structure)</text>

  <!-- service grid: name + chosen pattern, each card scans in sequence -->
  <g font-family="monospace">
    <!-- row 1 -->
    <g transform="translate(25,36)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="4.8s" begin="0.0s" repeatCount="indefinite"/></rect>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Identity</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Clean Architecture + ASP.NET Identity</text>
    </g>
    <g transform="translate(240,36)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="4.8s" begin="0.4s" repeatCount="indefinite"/></rect>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Catalog</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Vertical Slice + Carter/MediatR + Marten</text>
    </g>
    <g transform="translate(455,36)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="4.8s" begin="0.8s" repeatCount="indefinite"/></rect>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Pricing</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Simple services + gRPC hot path</text>
    </g>
    <g transform="translate(670,36)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="4.8s" begin="1.2s" repeatCount="indefinite"/></rect>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Basket</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Vertical Slice + Redis HybridCache + Outbox</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(25,96)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="4.8s" begin="1.6s" repeatCount="indefinite"/></rect>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Ordering</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Clean Arch + DDD + MassTransit Saga</text>
    </g>
    <g transform="translate(240,96)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="4.8s" begin="2.0s" repeatCount="indefinite"/></rect>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Inventory</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Layered: Repository + Unit of Work + Dapper</text>
    </g>
    <g transform="translate(455,96)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="4.8s" begin="2.4s" repeatCount="indefinite"/></rect>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Payment</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Clean Arch + Event Sourcing (MongoDB)</text>
    </g>
    <g transform="translate(670,96)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="4.8s" begin="2.8s" repeatCount="indefinite"/></rect>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Delivery</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Hexagonal (Ports &amp; Adapters) + MongoDB</text>
    </g>
    <!-- row 3 -->
    <g transform="translate(25,156)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="4.8s" begin="3.2s" repeatCount="indefinite"/></rect>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Notification</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Consumers + SignalR fan-out hub</text>
    </g>
    <g transform="translate(240,156)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="4.8s" begin="3.6s" repeatCount="indefinite"/></rect>
      <text x="10" y="20" font-size="11" fill="#e6edf3">CustomerSupport</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Connection manager + SignalR + Repository</text>
    </g>
    <g transform="translate(455,156)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="4.8s" begin="4.0s" repeatCount="indefinite"/></rect>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Reviews</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">Vertical Slice + MongoDB, eventual consistency</text>
    </g>
    <g transform="translate(670,156)">
      <rect width="205" height="50" rx="6" fill="#0f1420" stroke="#39ff88" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="4.8s" begin="4.4s" repeatCount="indefinite"/></rect>
      <text x="10" y="20" font-size="11" fill="#e6edf3">Reporting</text>
      <text x="10" y="36" font-size="8.5" fill="#39ff88">CQRS read model + Dapper + MySQL</text>
    </g>
  </g>

  <text x="25" y="232" font-family="monospace" font-size="12.5" fill="#39ff88" font-weight="bold">CI/CD — per service, every merge (Trivy + Cosign live; SonarCloud wired, pending token)</text>

  <!-- pipeline: stages light up in sequence, packets travel the arrows -->
  <g font-family="monospace" font-size="9">
    <g transform="translate(25,244)">
      <rect width="100" height="34" rx="5" fill="#0f2417" stroke="#39ff88"><animate attributeName="fill" values="#0f2417;#154a2c;#0f2417" dur="7.2s" begin="0.0s" repeatCount="indefinite"/></rect>
      <text x="14" y="21" fill="#39ff88">Restore</text>
    </g>
    <g transform="translate(133,244)">
      <rect width="100" height="34" rx="5" fill="#0f2417" stroke="#39ff88"><animate attributeName="fill" values="#0f2417;#154a2c;#0f2417" dur="7.2s" begin="0.5s" repeatCount="indefinite"/></rect>
      <text x="22" y="21" fill="#39ff88">Build</text>
    </g>
    <g transform="translate(241,244)">
      <rect width="100" height="34" rx="5" fill="#0f2417" stroke="#39ff88"><animate attributeName="fill" values="#0f2417;#154a2c;#0f2417" dur="7.2s" begin="1.0s" repeatCount="indefinite"/></rect>
      <text x="26" y="21" fill="#39ff88">Test</text>
    </g>
    <g transform="translate(349,244)">
      <rect width="100" height="34" rx="5" fill="#0f2417" stroke="#39ff88"><animate attributeName="fill" values="#0f2417;#154a2c;#0f2417" dur="7.2s" begin="1.5s" repeatCount="indefinite"/></rect>
      <text x="6" y="21" fill="#39ff88">CodeQL SAST</text>
    </g>
    <g transform="translate(457,244)">
      <rect width="100" height="34" rx="5" fill="#0f2417" stroke="#39ff88"><animate attributeName="fill" values="#0f2417;#154a2c;#0f2417" dur="7.2s" begin="2.0s" repeatCount="indefinite"/></rect>
      <text x="5" y="21" fill="#39ff88">E2E Playwright</text>
    </g>
    <g transform="translate(565,244)">
      <rect width="100" height="34" rx="5" fill="#0f2417" stroke="#39ff88"><animate attributeName="fill" values="#0f2417;#154a2c;#0f2417" dur="7.2s" begin="2.5s" repeatCount="indefinite"/></rect>
      <text x="20" y="21" fill="#39ff88">Trivy</text>
    </g>
    <g transform="translate(673,244)">
      <rect width="100" height="34" rx="5" fill="#0f2417" stroke="#39ff88"><animate attributeName="fill" values="#0f2417;#154a2c;#0f2417" dur="7.2s" begin="3.0s" repeatCount="indefinite"/></rect>
      <text x="10" y="21" fill="#39ff88">Cosign sign</text>
    </g>

    <!-- pending: wired, not yet green -->
    <g transform="translate(781,244)" opacity="0.9">
      <rect width="100" height="34" rx="5" fill="none" stroke="#ffb454" stroke-dasharray="4 3"/>
      <text x="6" y="15" fill="#ffb454">SonarCloud</text>
      <text x="10" y="27" fill="#ffb454" font-size="7.5">(pending token)</text>
    </g>

    <!-- traveling packets along the pipeline -->
    <g fill="#e6edf3">
      <circle r="2.8"><animateMotion dur="7.2s" begin="0.0s" repeatCount="indefinite" path="M30,261 L881,261"/></circle>
      <circle r="2.8" opacity="0.6"><animateMotion dur="7.2s" begin="2.4s" repeatCount="indefinite" path="M30,261 L881,261"/></circle>
    </g>

    <!-- connective arrows -->
    <g stroke="#39ff88" stroke-width="1.1" fill="none" opacity="0.8">
      <path d="M125 261 L132 261" marker-end="url(#arrow)"/>
      <path d="M233 261 L240 261" marker-end="url(#arrow)"/>
      <path d="M341 261 L348 261" marker-end="url(#arrow)"/>
      <path d="M449 261 L456 261" marker-end="url(#arrow)"/>
      <path d="M557 261 L564 261" marker-end="url(#arrow)"/>
      <path d="M665 261 L672 261" marker-end="url(#arrow)"/>
      <path d="M773 261 L780 261" marker-end="url(#arrow)"/>
    </g>
  </g>

  <text x="25" y="300" font-family="monospace" font-size="9.5" fill="#8ab" opacity="0.85">merge is blocked until build + test + SAST + E2E + Trivy are green — Cosign signs every image on master, keyless (Sigstore OIDC)</text>
</svg>
