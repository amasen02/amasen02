<svg width="900" height="190" viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg">
  <title>Boot terminal: whoami and mission.log, locked dark regardless of viewer theme</title>
  <defs>
    <linearGradient id="tbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="tbScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff88" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tbSigil" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tbClip">
      <rect width="900" height="190" rx="14"/>
    </clipPath>
    <filter id="tbGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="190" rx="14" fill="url(#tbBg)"/>

  <!-- faint runic/binary rain, right edge -->
  <g clip-path="url(#tbClip)" font-family="monospace" font-size="11" fill="#22c55e" opacity="0.22">
    <g>
      <text x="840" y="0">Δ</text><text x="840" y="20">0</text><text x="840" y="40">1</text><text x="840" y="60">Σ</text><text x="840" y="80">1</text><text x="840" y="100">0</text>
      <animateTransform attributeName="transform" type="translate" values="0,-100;0,190" dur="6.4s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.7">
      <text x="866" y="0">1</text><text x="866" y="20">∞</text><text x="866" y="40">0</text><text x="866" y="60">1</text><text x="866" y="80">λ</text><text x="866" y="100">0</text>
      <animateTransform attributeName="transform" type="translate" values="0,-140;0,190" dur="7.8s" begin="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- vertical scan beam -->
  <rect x="0" y="0" width="900" height="50" fill="url(#tbScan)" clip-path="url(#tbClip)">
    <animate attributeName="y" values="30;190;30" dur="6.5s" repeatCount="indefinite"/>
  </rect>

  <rect x="1" y="1" width="898" height="188" rx="13" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="1" y="1" width="898" height="28" rx="13" fill="#0a0e17"/>
  <circle cx="20" cy="15" r="5" fill="#ff5f56" opacity="0.55"/>
  <circle cx="38" cy="15" r="5" fill="#ffbd2e" opacity="0.55"/>
  <circle cx="56" cy="15" r="5" fill="#27c93f" opacity="0.55"/>
  <text x="450" y="19" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5b6472" letter-spacing="0.5">ama@amasen02:~$ mission.log</text>
  <line x1="1" y1="29" x2="899" y2="29" stroke="#1f2937" stroke-width="1"/>

  <!-- faint mystic sigil watermark, bottom-right -->
  <g transform="translate(848,150)" opacity="0.8">
    <circle r="34" fill="url(#tbSigil)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      <circle r="26" fill="none" stroke="#a855f7" stroke-width="0.6" opacity="0.5"/>
      <circle r="18" fill="none" stroke="#a855f7" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.4"/>
    </g>
  </g>

  <!-- terminal body -->
  <g font-family="monospace" font-size="13.5">
    <text x="30" y="58"><tspan fill="#22d3ee" filter="url(#tbGlow)">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
    <text x="30" y="80" fill="#39ff88" filter="url(#tbGlow)">&gt; ama_senevirathne — senior software engineer / tech lead</text>

    <text x="30" y="112"><tspan fill="#22d3ee" filter="url(#tbGlow)">$</tspan><tspan fill="#e6edf3"> cat mission.log</tspan></text>
    <text x="30" y="132" font-size="12" fill="#a8d8bd">ships production systems by day.</text>
    <text x="30" y="150" font-size="12" fill="#a8d8bd">designs autonomous agents that ship systems by night.</text>

    <text x="30" y="174" fill="#39ff88" filter="url(#tbGlow)">$ _<animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/></text>
  </g>
</svg>
