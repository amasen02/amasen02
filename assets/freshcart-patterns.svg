<svg width="900" height="210" viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg">
  <title>Design principles and patterns applied across FreshCart's 12 services</title>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
  </defs>

  <rect width="900" height="210" rx="14" fill="url(#bg4)"/>
  <rect x="1" y="1" width="898" height="208" rx="13" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <text x="25" y="26" font-family="monospace" font-size="12.5" fill="#39ff88" font-weight="bold">$ grep -rl "SOLID\|DDD\|CQRS\|Saga\|Outbox" src/ — principles &amp; patterns, applied not aspired to</text>

  <g font-family="monospace" font-size="10.5" fill="#e6edf3">
    <!-- row 1 -->
    <g transform="translate(25,42)">
      <rect width="200" height="38" rx="19" fill="#0f1420" stroke="#39ff88" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="4.8s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="24" text-anchor="middle">SOLID</text>
    </g>
    <g transform="translate(235,42)">
      <rect width="200" height="38" rx="19" fill="#0f1420" stroke="#39ff88" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="4.8s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="24" text-anchor="middle">KISS · YAGNI · DRY</text>
    </g>
    <g transform="translate(445,42)">
      <rect width="200" height="38" rx="19" fill="#0f1420" stroke="#39ff88" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="4.8s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="24" text-anchor="middle">CQRS</text>
    </g>
    <g transform="translate(655,42)">
      <rect width="200" height="38" rx="19" fill="#0f1420" stroke="#39ff88" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="4.8s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="24" text-anchor="middle">DDD: Aggregate · VO · Event</text>
    </g>

    <!-- row 2 -->
    <g transform="translate(25,90)">
      <rect width="200" height="38" rx="19" fill="#0f1420" stroke="#39ff88" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="24" text-anchor="middle">Saga (MassTransit)</text>
    </g>
    <g transform="translate(235,90)">
      <rect width="200" height="38" rx="19" fill="#0f1420" stroke="#39ff88" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="4.8s" begin="2.0s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="24" text-anchor="middle">Transactional Outbox</text>
    </g>
    <g transform="translate(445,90)">
      <rect width="200" height="38" rx="19" fill="#0f1420" stroke="#39ff88" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="4.8s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="24" text-anchor="middle">Event Sourcing</text>
    </g>
    <g transform="translate(655,90)">
      <rect width="200" height="38" rx="19" fill="#0f1420" stroke="#39ff88" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="4.8s" begin="2.8s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="24" text-anchor="middle">Repository + Unit of Work</text>
    </g>

    <!-- row 3 -->
    <g transform="translate(25,138)">
      <rect width="200" height="38" rx="19" fill="#0f1420" stroke="#39ff88" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="4.8s" begin="3.2s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="24" text-anchor="middle">Hexagonal (Ports/Adapters)</text>
    </g>
    <g transform="translate(235,138)">
      <rect width="200" height="38" rx="19" fill="#0f1420" stroke="#39ff88" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="4.8s" begin="3.6s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="24" text-anchor="middle">Vertical Slice</text>
    </g>
    <g transform="translate(445,138)">
      <rect width="200" height="38" rx="19" fill="#0f1420" stroke="#39ff88" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="4.8s" begin="4.0s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="24" text-anchor="middle">Strongly-typed IDs</text>
    </g>
    <g transform="translate(655,138)">
      <rect width="200" height="38" rx="19" fill="#0f1420" stroke="#39ff88" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="4.8s" begin="4.4s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="24" text-anchor="middle">HybridCache (L1+L2)</text>
    </g>
  </g>

  <text x="25" y="197" font-family="monospace" font-size="9.5" fill="#8ab" opacity="0.85">one architecture doc per service; the pattern is chosen for the problem, never copy-pasted</text>
</svg>
