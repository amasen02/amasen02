<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <title>Systems dossier: Verawright multi-agent company and private AGI/ASI research</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="sigilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff88" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#39ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="260" rx="14" fill="url(#bg2)"/>
  <rect x="1" y="1" width="898" height="258" rx="13" fill="none" stroke="#3a2a1a" stroke-width="1.5"/>

  <!-- header bar -->
  <rect x="1" y="1" width="898" height="30" rx="13" fill="#1a1208"/>
  <text x="20" y="21" font-family="monospace" font-size="12" fill="#ffb454" letter-spacing="1">CLASSIFICATION: RESTRICTED — CLEARANCE: OWNER ONLY</text>
  <text x="770" y="21" font-family="monospace" font-size="12" fill="#ffb454">FILE 02/02</text>

  <!-- mystic sigil, faint, behind right-side dossier -->
  <g transform="translate(700,150)" opacity="0.5">
    <circle r="80" fill="url(#sigilGlow)"/>
    <circle r="70" fill="none" stroke="#39ff88" stroke-width="0.6" opacity="0.5"/>
    <circle r="52" fill="none" stroke="#39ff88" stroke-width="0.6" opacity="0.35"/>
    <g stroke="#39ff88" stroke-width="0.6" opacity="0.4">
      <line x1="-80" y1="0" x2="80" y2="0"/>
      <line x1="0" y1="-80" x2="0" y2="80"/>
      <line x1="-56" y1="-56" x2="56" y2="56"/>
      <line x1="-56" y1="56" x2="56" y2="-56"/>
    </g>
    <circle r="4" fill="#39ff88">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- case file 1: verawright -->
  <g transform="translate(30,55)">
    <text font-family="monospace" font-size="13" fill="#39ff88" font-weight="bold">CASE 01 — VERAWRIGHT</text>
    <text y="18" font-family="monospace" font-size="10.5" fill="#8ab" opacity="0.85">status: ACTIVE · 38-agent autonomous software company</text>

    <!-- agent swarm org diagram -->
    <g transform="translate(10,40)" stroke="#39ff88" stroke-width="0.8" opacity="0.7">
      <line x1="60" y1="0" x2="10" y2="35"/>
      <line x1="60" y1="0" x2="60" y2="35"/>
      <line x1="60" y1="0" x2="110" y2="35"/>
      <line x1="10" y1="35" x2="0" y2="65"/>
      <line x1="10" y1="35" x2="25" y2="65"/>
      <line x1="60" y1="35" x2="45" y2="65"/>
      <line x1="60" y1="35" x2="75" y2="65"/>
      <line x1="110" y1="35" x2="95" y2="65"/>
      <line x1="110" y1="35" x2="120" y2="65"/>
    </g>
    <g fill="#39ff88">
      <circle cx="70" cy="40" r="5"/>
      <circle cx="20" cy="75" r="3.5"/><circle cx="70" cy="75" r="3.5"/><circle cx="120" cy="75" r="3.5"/>
      <circle cx="10" cy="105" r="3"/><circle cx="35" cy="105" r="3"/>
      <circle cx="55" cy="105" r="3"/><circle cx="85" cy="105" r="3"/>
      <circle cx="105" cy="105" r="3"/><circle cx="130" cy="105" r="3"/>
    </g>
    <text y="130" font-family="monospace" font-size="9.5" fill="#39ff88" opacity="0.8">research → build → QA → security review → release</text>
    <text y="146" font-family="monospace" font-size="9.5" fill="#39ff88" opacity="0.8">every stage gated: CI, code review, branch protection</text>
  </g>

  <!-- case file 2: AGI/ASI research (redacted) -->
  <g transform="translate(430,55)">
    <text font-family="monospace" font-size="13" fill="#ff6b6b" font-weight="bold">CASE 02 — AUTONOMOUS AGI/ASI RESEARCH</text>
    <text y="18" font-family="monospace" font-size="10.5" fill="#8ab" opacity="0.85">status: ACTIVE · 24/7 · private</text>

    <g font-family="monospace" font-size="10">
      <text y="42" fill="#39ff88">architecture: recursive self-improvement loop</text>
      <text y="60" fill="#39ff88">evaluation: ground-truth oracle, outcome-graded</text>
      <text y="78" fill="#8ab">deployment: <tspan fill="#39ff88">multi-agent</tspan></text>
      <rect x="88" y="70" width="120" height="11" fill="#0a0d13" stroke="#233047"/>
      <text y="96" fill="#8ab">scope: <tspan fill="#39ff88">continuous</tspan></text>
      <rect x="58" y="88" width="150" height="11" fill="#0a0d13" stroke="#233047"/>
      <text y="114" fill="#8ab">target domain:</text>
      <rect x="88" y="106" width="170" height="11" fill="#0a0d13" stroke="#233047"/>
      <text y="132" fill="#666" font-style="italic">// remaining fields withheld — private system</text>
    </g>
  </g>

  <text x="30" y="238" font-family="monospace" font-size="11" fill="#ffb454" opacity="0.75">// what you can verify is above. what you can't, is the point.</text>
</svg>
