<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <title>Systems dossier: Verawright multi-agent company and private AGI/ASI research</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="sigilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff88" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
    <filter id="dossierGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="300" rx="14" fill="url(#bg2)"/>
  <rect x="1" y="1" width="898" height="298" rx="13" fill="none" stroke="#3a2a1a" stroke-width="1.5"/>

  <!-- header bar -->
  <rect x="1" y="1" width="898" height="30" rx="13" fill="#1a1208"/>
  <text x="20" y="21" font-family="monospace" font-size="12" fill="#ffb454" letter-spacing="1" filter="url(#dossierGlow)">CLASSIFICATION: RESTRICTED — CLEARANCE: OWNER ONLY</text>
  <text x="770" y="21" font-family="monospace" font-size="12" fill="#ffb454">FILE 02/02</text>

  <!-- sweeping scan beam over the whole dossier -->
  <rect x="1" y="31" width="898" height="60" fill="url(#scanBeam)">
    <animate attributeName="y" values="31;238;31" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- mystic sigil, faint, behind right-side dossier -->
  <g transform="translate(700,175)" opacity="0.6">
    <circle r="85" fill="url(#sigilGlow)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <circle r="75" fill="none" stroke="#a855f7" stroke-width="0.6" opacity="0.5"/>
      <circle r="56" fill="none" stroke="#a855f7" stroke-width="0.6" stroke-dasharray="3 4" opacity="0.4"/>
    </g>
    <g stroke="#a855f7" stroke-width="0.6" opacity="0.4">
      <line x1="-85" y1="0" x2="85" y2="0"/>
      <line x1="0" y1="-85" x2="0" y2="85"/>
      <line x1="-60" y1="-60" x2="60" y2="60"/>
      <line x1="-60" y1="60" x2="60" y2="-60"/>
    </g>
    <circle r="4" fill="#a855f7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- case file 1: verawright -->
  <g transform="translate(30,50)">
    <text font-family="monospace" font-size="13" fill="#39ff88" font-weight="bold" filter="url(#dossierGlow)">CASE 01 — VERAWRIGHT</text>
    <text y="18" font-family="monospace" font-size="10.5" fill="#8ab" opacity="0.85">status: ACTIVE · 38-agent autonomous software company</text>

    <!-- agent swarm org diagram, nodes pulse in propagation order -->
    <g transform="translate(10,40)" stroke="#39ff88" stroke-width="0.8" opacity="0.7">
      <line x1="60" y1="0" x2="10" y2="35"/>
      <line x1="60" y1="0" x2="60" y2="35"/>
      <line x1="60" y1="0" x2="110" y2="35"/>
      <line x1="10" y1="35" x2="0" y2="65"/>
      <line x1="10" y1="35" x2="25" y2="65"/>
      <line x1="60" y1="35" x2="45" y2="65"/>
      <line x1="60" y1="35" x2="75" y2="65"/>
      <line x1="110" y1="35" x2="95" y2="65"/>
      <line x1="110" y1="35" x2="120" y2="65"/>
    </g>
    <g transform="translate(10,40)" fill="#39ff88">
      <circle cx="60" cy="0" r="5.5"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="10" cy="35" r="4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="35" r="4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="110" cy="35" r="4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="65" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="25" cy="65" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.65s" repeatCount="indefinite"/></circle>
      <circle cx="45" cy="65" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="75" cy="65" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.75s" repeatCount="indefinite"/></circle>
      <circle cx="95" cy="65" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="65" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.85s" repeatCount="indefinite"/></circle>
    </g>
    <!-- data packet traveling root -> leaf -->
    <circle r="2.5" fill="#e6edf3">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M70,40 L120,75 L145,105"/>
    </circle>

    <text y="130" font-family="monospace" font-size="9.5" fill="#39ff88" opacity="0.8">research → build → QA → security review → release</text>
    <text y="146" font-family="monospace" font-size="9.5" fill="#39ff88" opacity="0.8">every stage gated: CI, code review, branch protection</text>
  </g>

  <!-- case file 2: AGI/ASI research -->
  <g transform="translate(430,50)">
    <text font-family="monospace" font-size="13" fill="#ff6b6b" font-weight="bold" filter="url(#dossierGlow)">CASE 02 — AUTONOMOUS AGI/ASI RESEARCH</text>
    <text y="18" font-family="monospace" font-size="10.5" fill="#8ab" opacity="0.85">status: ACTIVE · 24/7 · private</text>

    <g font-family="monospace" font-size="9.5">
      <text y="40" fill="#8ab">capabilities:</text>
      <text y="55" fill="#39ff88">→ multi-sport outcome prediction (hockey, MMA, cricket,</text>
      <text y="68" fill="#39ff88">&#160;&#160;virtual-FIFA) — outcome-graded, multi-model</text>
      <text y="83" fill="#39ff88">→ daily validated pick emission ("daily lock"), gated</text>
      <text y="96" fill="#39ff88">&#160;&#160;through an 8-layer evaluation pipeline</text>
      <text y="111" fill="#39ff88">→ quantitative trading-signal automation (Quotex)</text>
      <text y="126" fill="#39ff88">→ continuous 0-day security research pipeline</text>
      <text y="141" fill="#39ff88">→ recursive self-improvement + ground-truth-oracle</text>
      <text y="154" fill="#39ff88">&#160;&#160;evaluation, multi-agent spawn</text>

      <rect x="8" y="163" width="150" height="11" fill="#0a0d13" stroke="#233047">
        <animate attributeName="opacity" values="1;0.55;1" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <text x="170" y="172" fill="#666" font-style="italic">deployment infra</text>
      <rect x="8" y="181" width="110" height="11" fill="#0a0d13" stroke="#233047">
        <animate attributeName="opacity" values="1;0.55;1" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <text x="130" y="190" fill="#666" font-style="italic">model + data specifics</text>

      <text y="206" fill="#666" font-style="italic">// what's built is real; what's redacted, stays that way</text>
    </g>
  </g>

  <text x="30" y="288" font-family="monospace" font-size="11" fill="#ffb454" opacity="0.75">// what you can verify is above. what you can't, is the point.</text>
</svg>
