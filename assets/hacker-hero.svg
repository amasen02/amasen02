<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <title>Hooded developer working at a glowing terminal, mystic-hacker edition</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#39ff88" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#39ff88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hoodShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2230"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <radialGradient id="mysticRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="heroGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect width="900" height="300" rx="14"/>
    </clipPath>
  </defs>

  <rect width="900" height="300" rx="14" fill="url(#bg)"/>

  <!-- falling matrix-style code rain, clipped to the card -->
  <g clip-path="url(#cardClip)" font-family="monospace" font-size="12" fill="#22c55e">
    <g opacity="0.4">
      <text x="10" y="0">0</text><text x="10" y="24">1</text><text x="10" y="48">0</text><text x="10" y="72" fill="#a855f7">Δ</text><text x="10" y="96">1</text><text x="10" y="120">0</text>
      <animateTransform attributeName="transform" type="translate" values="0,-120;0,300" dur="5.2s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.3">
      <text x="60" y="0">1</text><text x="60" y="24">;</text><text x="60" y="48">1</text><text x="60" y="72">0</text><text x="60" y="96">{</text><text x="60" y="120">1</text>
      <animateTransform attributeName="transform" type="translate" values="0,-160;0,300" dur="6.8s" begin="0.6s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.35">
      <text x="850" y="0">λ</text><text x="850" y="24">0</text><text x="850" y="48">1</text><text x="850" y="72" fill="#22d3ee">Σ</text><text x="850" y="96">1</text><text x="850" y="120">=&gt;</text>
      <animateTransform attributeName="transform" type="translate" values="0,-130;0,300" dur="5.9s" begin="1.1s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.28">
      <text x="800" y="0">0</text><text x="800" y="24">1</text><text x="800" y="48">{ }</text><text x="800" y="72">0</text><text x="800" y="96">1</text><text x="800" y="120">λ</text>
      <animateTransform attributeName="transform" type="translate" values="0,-150;0,300" dur="7.4s" begin="2.0s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.22">
      <text x="740" y="0">1</text><text x="740" y="24">0</text><text x="740" y="48">1</text><text x="740" y="72" fill="#a855f7">∞</text><text x="740" y="96">0</text><text x="740" y="120">1</text>
      <animateTransform attributeName="transform" type="translate" values="0,-140;0,300" dur="6.1s" begin="2.7s" repeatCount="indefinite"/>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="298" rx="13" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <!-- mystic summoning ring behind the hooded figure -->
  <g transform="translate(184,130)" opacity="0.85">
    <circle r="140" fill="url(#mysticRing)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
      <circle r="118" fill="none" stroke="#a855f7" stroke-width="0.6" opacity="0.45"/>
      <circle r="96" fill="none" stroke="#a855f7" stroke-width="0.6" stroke-dasharray="2 6" opacity="0.35"/>
    </g>
    <g stroke="#a855f7" stroke-width="0.5" opacity="0.3">
      <line x1="-118" y1="0" x2="118" y2="0"/>
      <line x1="0" y1="-118" x2="0" y2="118"/>
    </g>
  </g>

  <!-- laptop -->
  <g transform="translate(300,110)">
    <circle cx="140" cy="20" r="90" fill="url(#screenGlow)"/>
    <rect x="40" y="-30" width="200" height="120" rx="6" fill="#0a0d13" stroke="#233047" stroke-width="2"/>
    <rect x="52" y="-20" width="176" height="100" rx="3" fill="#03140a"/>
    <g font-family="monospace" font-size="9" fill="#39ff88">
      <text x="60" y="-4">$ whoami</text>
      <text x="60" y="10">&gt; ama_senevirathne</text>
      <text x="60" y="24">$ status --check</text>
      <text x="60" y="38">[OK] agents online</text>
      <text x="60" y="52" opacity="0.8">$ _<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></text>
    </g>
    <path d="M 20 90 L 260 90 L 280 110 L 0 110 Z" fill="#111826" stroke="#233047" stroke-width="2"/>
  </g>

  <!-- agentic-systems network radiating from the terminal -->
  <g stroke="#39ff88" stroke-width="1" fill="none" opacity="0.55">
    <path d="M 440 115 L 610 45" stroke-dasharray="4 3"><animate attributeName="stroke-dashoffset" values="0;-14" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M 440 115 L 690 95" stroke-dasharray="4 3"><animate attributeName="stroke-dashoffset" values="0;-14" dur="1.7s" repeatCount="indefinite"/></path>
    <path d="M 440 115 L 705 165" stroke-dasharray="4 3"><animate attributeName="stroke-dashoffset" values="0;-14" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M 440 115 L 645 210" stroke-dasharray="4 3"><animate attributeName="stroke-dashoffset" values="0;-14" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M 440 115 L 540 230" stroke-dasharray="4 3"><animate attributeName="stroke-dashoffset" values="0;-14" dur="1.9s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#e6edf3">
    <circle r="2.4"><animateMotion dur="1.6s" repeatCount="indefinite" path="M 440 115 L 610 45"/></circle>
    <circle r="2.4"><animateMotion dur="1.9s" repeatCount="indefinite" path="M 440 115 L 690 95"/></circle>
    <circle r="2.4"><animateMotion dur="1.5s" repeatCount="indefinite" path="M 440 115 L 705 165"/></circle>
    <circle r="2.4"><animateMotion dur="1.8s" repeatCount="indefinite" path="M 440 115 L 645 210"/></circle>
    <circle r="2.4"><animateMotion dur="2.1s" repeatCount="indefinite" path="M 440 115 L 540 230"/></circle>
  </g>
  <g font-family="monospace" font-size="10.5" fill="#39ff88">
    <circle cx="610" cy="45" r="3.5" fill="#39ff88"/>
    <text x="618" y="48">RAG store</text>
    <circle cx="690" cy="95" r="3.5" fill="#39ff88"/>
    <text x="698" y="98">ReAct loop</text>
    <circle cx="705" cy="165" r="3.5" fill="#39ff88"/>
    <text x="713" y="168">MCP tools</text>
    <circle cx="645" cy="210" r="3.5" fill="#39ff88"/>
    <text x="653" y="213">prompt eng</text>
    <circle cx="540" cy="230" r="3.5" fill="#39ff88"/>
    <text x="548" y="233">multi-agent</text>
    <g opacity="0.6">
      <animate attributeName="opacity" values="0.35;0.85;0.35" dur="2.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- hooded figure -->
  <g transform="translate(150,60)">
    <!-- body / hoodie -->
    <path d="M -40 200 C -45 120 -25 70 30 62 C 90 70 110 120 105 200 Z" fill="url(#hoodShade)" stroke="#2a3346" stroke-width="1.5"/>
    <!-- hood -->
    <path d="M -18 70 C -22 20 20 -12 34 -12 C 50 -12 92 18 88 70 C 70 40 0 40 -18 70 Z" fill="#151b27" stroke="#2f3b52" stroke-width="1.5"/>
    <!-- face void -->
    <ellipse cx="34" cy="46" rx="26" ry="30" fill="#010203"/>
    <!-- faint eye glow -->
    <ellipse cx="34" cy="50" rx="14" ry="4" fill="#39ff88" opacity="0.45">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <!-- arms toward keyboard -->
    <path d="M 100 150 C 140 155 165 165 178 178" fill="none" stroke="#151b27" stroke-width="22" stroke-linecap="round"/>
    <path d="M -30 150 C -55 158 -68 168 -78 180" fill="none" stroke="#151b27" stroke-width="22" stroke-linecap="round"/>
  </g>

  <g font-family="monospace" font-size="13">
    <text x="31.5" y="240" fill="#ff00d4" opacity="0">
      // building things most people won't understand until they ship
      <animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.93;0.945;0.96;1" dur="6.5s" repeatCount="indefinite"/>
    </text>
    <text x="28.5" y="240" fill="#22d3ee" opacity="0">
      // building things most people won't understand until they ship
      <animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.93;0.945;0.96;1" dur="6.5s" begin="0.04s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="240" fill="#39ff88" opacity="0.85">// building things most people won't understand until they ship</text>
  </g>

  <line x1="260" y1="262" x2="640" y2="262" stroke="#1f2937" stroke-width="1"/>
  <text x="450" y="284" text-anchor="middle" font-family="monospace" font-size="13.5" font-style="italic" fill="#39ff88" filter="url(#heroGlow)" opacity="0.95">"Ships quietly. Runs unsupervised. Never stops thinking."</text>
</svg>
