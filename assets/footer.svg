<svg width="900" height="50" viewBox="0 0 900 50" xmlns="http://www.w3.org/2000/svg">
  <title>Footer: closing line</title>
  <defs>
    <linearGradient id="ftBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="ftTrace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="ftGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="50" rx="12" fill="url(#ftBg)"/>
  <rect x="1" y="1" width="898" height="48" rx="11" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="60" y="0" width="780" height="1.5" fill="url(#ftTrace)"/>
  <text x="450" y="30" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#39ff88" filter="url(#ftGlow)" opacity="0.92">// every repo here is real, working code with a green CI pipeline — click through and run it.</text>
  <text x="866" y="30" font-family="monospace" font-size="10" fill="#a855f7" opacity="0.7">EOF</text>
</svg>
